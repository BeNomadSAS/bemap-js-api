<!doctype html>
<!-- ============================================================================
     Path A — BeMap JS API (recommended). The SDK owns login, JWT, request
     signing (transformRequest), style resolution and the tile cache.

     Serve over HTTP (not file://). Adjust the /dist/ paths to where you host the
     bundle. Replace the env hosts + credentials.

     PRODUCTION: do NOT ship login/password to the browser. Replace the login/
     password fields with `tilesTokenProvider` pointing at your backend — see
     backend-token-proxy.md. Inline credentials are for demos/evaluation only.
============================================================================ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/dist/bemap-js-api.css">
  <script src="/dist/maplibre-gl.js"></script>
  <script src="/dist/pmtiles.js"></script>
  <script src="/dist/bemap-js-api.js"></script>
</head>
<body>
  <div id="map" style="position:absolute;inset:0;background:#d4ecf5"></div>
  <script>
    // Env hosts (beta shown). preprod/prod: swap both hosts together.
    var ctx = new bemap.Context({
      host:      'bemap-beta.benomad.com',        // BeMap host (services auth)
      secure:    true,
      login:     'YOUR_LOGIN',                    // demo/eval only
      password:  'YOUR_PASSWORD',                 // production → tilesTokenProvider
      tilesHost: 'mptiles-api-beta.benomad.net'   // tiles Worker
    });

    var map = new bemap.MapLibreMap(ctx, 'map');
    map.move(2.35, 48.85, 12);                    // lon, lat, zoom  (lon FIRST)

    map.on('error', function (e) {
      var err = e && e.error ? e.error : e;
      console.error('bemap tiles error:', err && (err.message || err));
    });

    // Optional services (only if your account is entitled — otherwise they 400/403):
    // Direct geocoding
    new bemap.Geocoder(ctx)
      .geocode(new bemap.GeocodingRequest({ place: 'Nice', language: 'fr', maxResult: 5,
        proximity: new bemap.Coordinate(7.26, 43.70), addressDetails: true }), { geoserver: 'nominatim' })
      .then(function (r) { console.log('geocode', r.getGeocodingItems().length, 'results'); })
      .catch(function (err) { console.warn('geocode', err.getCode && err.getCode(), err.getMessage && err.getMessage()); });

    // Routing (v2)
    new bemap.RoutingV2(ctx)
      .calculate(new bemap.RoutingRequest({
        destinations: [new bemap.Coordinate(7.134, 43.636), new bemap.Coordinate(7.121, 43.580)],
        routingCriterias: [bemap.RoutingCriteria.FASTEST],
        options: [bemap.RoutingOptions.POLYLINE],
        routingVehicleProfile: new bemap.RoutingVehicleProfile({ transportMode: bemap.TransportMode.CAR })
      }))
      .then(function (r) { var route = r.getFirstRoute(); console.log('route', route.getLength(), 'm', route.getDuration(), 's'); })
      .catch(function (err) { console.warn('route', err.getMessage && err.getMessage()); });
  </script>
</body>
</html>
